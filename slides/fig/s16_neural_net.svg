    <text x="20" y="328" font-size="17" fill="#666"><tspan font-weight="700" fill="#1b5e9e">Training</tspan> is nothing but this: show it text, see what it guessed, and nudge every one of those</text>
    <text x="20" y="354" font-size="17" fill="#666">billions of numbers so the guess gets better. Nobody sets them by hand, and nobody can read them after.</text>

