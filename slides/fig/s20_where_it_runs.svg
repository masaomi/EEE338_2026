    <text x="110" y="124" font-size="15" text-anchor="middle" fill="#666">laptop, ssh</text>
    <path d="M182 105 H244" stroke="#1b1b1b" stroke-width="3" marker-end="url(#ak)"/>
    <ellipse cx="790" cy="105" rx="90" ry="45" fill="#fdf3f2" stroke="#b3261e" stroke-width="3"/>
    <text x="790" y="100" font-size="16" text-anchor="middle" fill="#b3261e" font-weight="700">api.anthropic.com</text>
