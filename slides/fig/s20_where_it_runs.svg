<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" aria-label="the agent runs inside the cluster next to the data; only text leaves the cluster to the API; you reach it over ssh"><title>the agent runs inside the cluster next to the data; only text leaves the cluster to the API; you reach it over ssh</title><rect x="0" y="0" width="900" height="200" fill="#ffffff"/>
