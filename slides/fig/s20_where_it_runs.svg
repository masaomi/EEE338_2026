    <text x="450" y="50" font-size="20" text-anchor="middle" font-weight="700">fgcz-kl-004</text>
    <rect x="280" y="75" width="150" height="80" rx="10" fill="#fff" stroke="#8a8f98" stroke-width="3"/>
    <text x="355" y="110" font-size="20" text-anchor="middle" fill="#666">data</text>
    <text x="355" y="136" font-size="15" text-anchor="middle" fill="#666">130 GB, stays here</text>
    <rect x="470" y="75" width="150" height="80" rx="10" fill="#fff" stroke="#1b5e9e" stroke-width="4"/>
