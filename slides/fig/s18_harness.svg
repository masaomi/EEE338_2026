<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" aria-label="the model sits inside a harness; the harness runs bash, read and edit on the machine, and feeds the real output back to the model"><title>the model sits inside a harness; the harness runs bash, read and edit on the machine, and feeds the real output back to the model</title><rect x="0" y="0" width="900" height="250" fill="#ffffff"/>
